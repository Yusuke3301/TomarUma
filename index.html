<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f1220">
  <title>TomarUma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="topo">
      <h1>Tomar<span>Uma</span></h1>
      <p>Jogue, suba de nível e dispute o ranking.</p>
    </header>

    <!-- Tela de login / cadastro -->
    <section id="tela-auth" class="cartao">
      <div class="abas">
        <button id="aba-entrar" class="aba ativa" type="button">Entrar</button>
        <button id="aba-criar" class="aba" type="button">Criar conta</button>
      </div>

      <form id="form-auth" novalidate>
        <label id="campo-apelido" hidden>
          Apelido
          <input id="apelido" type="text" minlength="3" maxlength="20" autocomplete="nickname" placeholder="3 a 20 caracteres">
        </label>
        <label>
          E-mail
          <input id="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
        </label>
        <label>
          Senha
          <input id="senha" type="password" minlength="6" autocomplete="current-password" placeholder="mínimo 6 caracteres" required>
        </label>
        <button id="btn-enviar" type="submit" class="primario">Entrar</button>
        <p id="msg" role="status"></p>
      </form>
    </section>

    <!-- Tela do jogador logado -->
    <section id="tela-app" hidden>
      <div class="cartao perfil">
        <div>
          <p class="rotulo">Jogador</p>
          <h2 id="nome">-</h2>
        </div>
        <div class="pontos">
          <strong id="pontos">0</strong>
          <span>pontos</span>
        </div>
        <span id="selo" class="selo bronze">bronze</span>
      </div>

      <div class="cartao">
        <h3>Ranking</h3>
        <ol id="ranking" class="ranking"></ol>
      </div>

      <div class="cartao aviso">
        <p>Os jogos chegam nas próximas etapas: jogo da velha e cobrinha.</p>
      </div>

      <button id="btn-sair" class="secundario" type="button">Sair</button>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
